<div class="p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto space-y-8 font-sans text-slate-100 min-h-screen">

  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-[#121620] border border-slate-800 p-6 rounded-2xl shadow-2xl">
    <div>
      <h2 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        Update Portfolio
      </h2>
      <p class="text-sm text-slate-400 mt-1">Manage user assets, holdings, and update item details.</p>
    </div>
  </div>

  <!-- Form Container -->
  <form [formGroup]="portfolioForm" (ngSubmit)="onSubmit()" class="space-y-6">

    <!-- Username Card -->
    <div class="bg-[#121620] border border-slate-800 p-6 rounded-2xl shadow-xl space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
        Username
      </label>
      <input
        type="text"
        formControlName="username"
        placeholder="Enter username"
        class="w-full bg-[#161b26] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-amber-400 transition-all font-medium"
      >
    </div>

    <!-- Items Section Header -->
    <div class="flex items-center justify-between pt-2">
      <h3 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
        Portfolio Items 
        <span class="px-2.5 py-0.5 bg-[#121620] text-amber-400 text-xs font-mono rounded-full border border-slate-800">
          {{ items.controls.length }}
        </span>
      </h3>
    </div>

    <!-- Form Array: Items List -->
    <div formArrayName="items" class="space-y-6">

      @for (item of items.controls; track $index) {

        <div 
          class="bg-[#121620] border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5 relative overflow-hidden transition-all hover:border-slate-700"
          [formGroupName]="$index"
        >
          <!-- Item Card Header -->
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
              <span class="px-2 py-0.5 bg-[#161b26] text-slate-400 text-xs font-mono rounded border border-slate-800">
                #{{ $index + 1 }}
              </span>
              Item Information
            </h3>
            
            <button
              type="button"
              (click)="editPortfolioitem($index)"
              class="bg-emerald-500 bg-opacity-10 hover:bg-opacity-20 text-emerald-400 border border-emerald-500 border-opacity-30 font-semibold px-4 py-1.5 rounded-xl transition-all text-xs cursor-pointer"
            >
              Save / Edit Item
            </button>
          </div>

          <!-- Inputs Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Asset Name -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-400">Asset Name</label>
              <input
                type="text"
                formControlName="assetname"
                placeholder="Enter asset name"
                class="w-full bg-[#161b26] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-amber-400 transition-all"
              >
            </div>

            <!-- Quantity -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-400">Quantity</label>
              <input
                type="number"
                formControlName="quantity"
                placeholder="Enter quantity"
                class="w-full bg-[#161b26] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-amber-400 transition-all font-mono"
              >
            </div>

            <!-- Average Buy Price -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-400">Average Buy Price ($)</label>
              <input
                type="number"
                formControlName="average_buy_price"
                placeholder="Enter average buy price"
                class="w-full bg-[#161b26] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-amber-400 transition-all font-mono"
              >
            </div>

            <!-- Updated At -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-400">Updated At</label>
              <input
                type="datetime-local"
                formControlName="updated_at"
                class="w-full bg-[#161b26] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-amber-400 transition-all [color-scheme:dark]"
              >
            </div>

          </div>

        </div>

      }

    </div>

    <div class="border-t border-slate-800 pt-4"></div>

    <!-- Actions Section -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <button 
        type="button" 
        (click)="addPortfolioitems()"
        class="w-full sm:w-auto bg-[#121620] hover:bg-slate-800 text-amber-400 border border-slate-800 font-semibold px-6 py-3 rounded-xl transition-all text-sm flex items-center justify-center gap-2 cursor-pointer shadow-lg"
      >
        <span class="text-base font-bold">+</span> Add Item
      </button>

      <button 
        type="submit" 
        class="w-full sm:w-auto bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-8 py-3 rounded-xl transition-all text-sm cursor-pointer shadow-lg active:scale-95"
      >
        Update Portfolio
      </button>
    </div>

  </form>

</div>
